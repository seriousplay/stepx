[package]
name = "command"
version = "0.1.0"
edition = "2024"
publish = false
license = "AGPL-3.0-only"

[features]
test-util = []

[dependencies]

[target."cfg(windows)".dependencies]
win32job = "2.0.2"

[target."cfg(not(target_family = \"wasm\"))".dependencies.async-process]
version = "2.3.0"

[target."cfg(not(target_family = \"wasm\"))".dependencies.futures-lite]
version = "1.13.0"

[target."cfg(windows)".dependencies.anyhow]
version = "1.0"

[target."cfg(windows)".dependencies.lazy_static]
version = "1.4.0"

[target."cfg(windows)".dependencies.log]
version = "0.4"
features = [ "serde", "std",]

[target."cfg(windows)".dependencies.thiserror]
version = "2.0.17"

[target."cfg(windows)".dependencies.windows]
version = "0.62.2"
features = [ "Win32", "Win32_System", "Win32_System_Kernel", "Win32_System_Threading", "Win32_System_LibraryLoader", "Wdk_System", "Wdk_System_SystemServices", "Win32_System_Com", "Win32_System_SecurityCenter", "Win32_System_SystemInformation", "Win32_System_Console", "Win32_UI", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_UI_Accessibility", "Win32_UI_TextServices", "Win32_Graphics_Gdi", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_Diagnostics_Debug", "Win32_System_Environment", "Win32_System_IO", "Win32_System_ProcessStatus", "Win32_System_Registry", "Win32_System_WindowsProgramming", "Win32_Storage", "Win32_Security", "Win32_Storage_FileSystem", "Win32_Foundation", "Wdk_Foundation", "Wdk_Storage_FileSystem",]

[target."cfg(unix)".dependencies.libc]
version = "0.2.81"
