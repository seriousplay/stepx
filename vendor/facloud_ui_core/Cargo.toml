[package]
name = "facloud_ui_core"
version = "0.1.0"
edition = "2021"
authors = [ "FaCloud Team",]
publish = false
license = "MIT"

[features]
traces = []
integration_tests = [ "dep:minimp4", "dep:openh264",]
log_named_telemetry_events = []
schema_gen = [ "dep:schemars",]
settings_value = [ "dep:settings_value",]
test-util = []

[dependencies]
anyhow = "1.0"
async-executor = "1.4.1"
bounded-vec-deque = "0.1"
chrono = "0.4"
futures = "0.3"
infer = "0.19.0"
lazy_static = "1.4.0"
log = "0.4"
num-derive = "0.4.2"
num_cpus = "1.0"
ordered-float = "3.0.0"
raw-window-handle = "0.6.2"
rstar = "0.12.2"
titlecase = "1.0"
trait-set = "0.3.0"

[dependencies.async-broadcast]
version = "0.7.2"

[dependencies.async-channel]
version = "2.3.1"

[dependencies.async-task]
version = "4.2.0"

[dependencies.async-fs]
version = "2.1.2"

[dependencies.bytes]
version = "1.11.1"
features = [ "serde",]

[dependencies.cfg-if]
version = "1.0.0"

[dependencies.dashmap]
version = "6.1.0"

[dependencies.derivative]
version = "2.2.0"

[dependencies.derive_more]
version = "0.99.17"

[dependencies.dirs]
version = "6.0.0"

[dependencies.enum-iterator]
version = "1.1.3"

[dependencies.float-cmp]
version = "0.9.0"

[dependencies.futures-lite]
version = "1.13.0"

[dependencies.futures-util]
version = "0.3"
default-features = false

[dependencies.image]
version = "0.25.9"
default-features = false
features = [ "rayon", "jpeg", "png", "gif", "webp",]

[dependencies.minimp4]
version = "0.1.2"
optional = true

[dependencies.openh264]
version = "0.8"
optional = true

[dependencies.instant]
version = "0.1.12"
features = [ "wasm-bindgen",]

[dependencies.itertools]
version = "0.14.0"

[dependencies.schemars]
version = "1"
optional = true

[dependencies.settings_value]
path = "../settings_value"
default-features = false
optional = true
features = [ "derive",]

[dependencies.markdown_parser]
path = "../markdown_parser"

[dependencies.num-traits]
version = "0.2"

[dependencies.parking_lot]
version = "0.12.1"

[dependencies.pathfinder_color]
version = "0.5"

[dependencies.pathfinder_geometry]
version = "0.5.1"

[dependencies.rand]
version = "0.8.2"

[dependencies.rangemap]
version = "1.3.0"

[dependencies.resvg]
version = "0.47.0"

[dependencies.rustc-hash]
version = "2.1.1"

[dependencies.serde]
version = "1.0"
features = [ "derive", "rc",]

[dependencies.serde_json]
version = "1.0"
features = [ "raw_value",]

[dependencies.similar]
version = "2.7"
features = [ "inline",]

[dependencies.smallvec]
version = "1.6.1"

[dependencies.string-offset]
path = "../string-offset"

[dependencies.strum]
version = "0.27"

[dependencies.strum_macros]
version = "0.27"

[dependencies.sum_tree]
path = "../sum_tree"

[dependencies.tempfile]
version = "3.8.0"

[dependencies.thiserror]
version = "2.0.17"

[dependencies.tokio]
version = "1.47.1"

[dependencies.vec1]
version = "1.8.0"
features = [ "serde",]

[dependencies.facloud_util]
path = "../facloud_util"

[build-dependencies.cfg_aliases]
version = "0.2.1"

[target."cfg(target_family = \"wasm\")".dependencies]
woothee = "0.13.0"

[target."cfg(not(target_family = \"wasm\"))".dependencies.async-io]
version = "2.4.0"

[target."cfg(not(target_family = \"wasm\"))".dependencies.ctrlc]
version = "3.4.7"

[target."cfg(not(target_family = \"wasm\"))".dependencies.font-kit]
git = "https://github.com/warpdotdev/font-kit"
rev = "a04b225ecb639bb850f21d05212cfdc7465000f3"
default-features = false
features = [ "source",]

[target."cfg(not(target_family = \"wasm\"))".dependencies.tokio]
version = "1.47.1"
features = [ "rt-multi-thread",]

[target."cfg(any(target_os = \"linux\", target_os = \"windows\"))".dependencies.arboard]
version = "3.6.1"
default-features = false
features = [ "image-data",]

[target."cfg(target_family = \"wasm\")".dependencies.gloo]
version = "0.11.0"
default-features = false
features = [ "events", "futures", "utils",]

[target."cfg(target_family = \"wasm\")".dependencies.wasm-bindgen-futures]
version = "0.4.42"
