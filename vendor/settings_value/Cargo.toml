[package]
name = "settings_value"
version = "0.1.0"
edition = "2021"
authors = [ "FaCloud Team",]
publish = false
license = "AGPL-3.0-only"

[features]
derive = [ "dep:settings_value_derive",]

[dependencies.chrono]
version = "0.4.38"
features = [ "serde",]

[dependencies.instant]
version = "0.1.12"
features = [ "wasm-bindgen",]

[dependencies.schemars]
version = "1"
features = [ "chrono04",]

[dependencies.serde]
version = "1.0"
features = [ "derive", "rc",]

[dependencies.serde_json]
version = "1.0"
features = [ "raw_value",]

[dependencies.settings_value_derive]
path = "../settings_value_derive"
optional = true
